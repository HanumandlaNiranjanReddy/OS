<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P File Sharing System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .peer-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .info-item {
            text-align: center;
            padding: 10px;
        }

        .info-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .info-value {
            color: #667eea;
            font-size: 1.2em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        .files-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .section-header h2 {
            color: #333;
            font-size: 1.8em;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .file-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .file-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border-color: #667eea;
        }

        .file-icon {
            font-size: 3em;
            text-align: center;
            margin-bottom: 15px;
        }

        .file-name {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .file-size {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .download-btn {
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
        }

        .download-btn:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 5em;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: none;
            z-index: 1000;
        }

        .toast.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
            }
            to {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 P2P File Sharing System</h1>
            <p>Share files directly between peers without a central server</p>
            
            <div class="peer-info" id="peerInfo">
                <div class="info-item">
                    <div class="info-label">Peer IP Address</div>
                    <div class="info-value" id="peerIp">Loading...</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Server Port</div>
                    <div class="info-value" id="peerPort">Loading...</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Files Available</div>
                    <div class="info-value" id="fileCount">0</div>
                </div>
            </div>
        </div>

        <div class="files-section">
            <div class="section-header">
                <h2>📁 Shared Files</h2>
                <button class="refresh-btn" onclick="loadFiles()">🔄 Refresh</button>
            </div>
            
            <div id="filesContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading files...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                'pdf': '📄',
                'doc': '📝', 'docx': '📝',
                'xls': '📊', 'xlsx': '📊',
                'ppt': '📊', 'pptx': '📊',
                'txt': '📃',
                'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️',
                'mp4': '🎥', 'avi': '🎥', 'mov': '🎥',
                'mp3': '🎵', 'wav': '🎵',
                'zip': '📦', 'rar': '📦',
                'exe': '⚙️',
                'html': '🌐', 'css': '🎨', 'js': '⚡'
            };
            return icons[ext] || '📄';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function downloadFile(filename) {
            showToast(`Downloading ${filename}...`);
            window.location.href = `/download/${filename}`;
            setTimeout(() => {
                showToast(`✓ Downloaded ${filename}`);
            }, 1000);
        }

        async function loadFiles() {
            const container = document.getElementById('filesContainer');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading files...</p></div>';

            try {
                const response = await fetch('/api/files');
                const data = await response.json();

                if (data.status === 'success') {
                    // Update peer info
                    document.getElementById('peerIp').textContent = data.peer_info.ip;
                    document.getElementById('peerPort').textContent = data.peer_info.port;
                    document.getElementById('fileCount').textContent = data.files.length;

                    if (data.files.length === 0) {
                        container.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon">📂</div>
                                <h3>No Files Available</h3>
                                <p>Add files to the 'shared' directory to start sharing</p>
                            </div>
                        `;
                    } else {
                        const fileCards = data.files.map(file => `
                            <div class="file-card" onclick="downloadFile('${file.name}')">
                                <div class="file-icon">${getFileIcon(file.name)}</div>
                                <div class="file-name">${file.name}</div>
                                <div class="file-size">${file.size_display}</div>
                                <button class="download-btn" onclick="event.stopPropagation(); downloadFile('${file.name}')">
                                    ⬇️ Download
                                </button>
                            </div>
                        `).join('');

                        container.innerHTML = `<div class="file-grid">${fileCards}</div>`;
                    }
                }
            } catch (error) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <h3>Error Loading Files</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Load files when page loads
        loadFiles();

        // Auto-refresh every 30 seconds
        setInterval(loadFiles, 30000);
    </script>
</body>
</html>
